name: "[CD] Deploy to Dev Server"

on:
  push:
    branches: [ dev ]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      to_update_list: ${{ steps.deploy-target.outputs.to_update_list }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: true

      - name: Get Changed Directories
        id: changed-dir-names
        uses: tj-actions/changed-files@v45
        with:
          files: 'til-*/**'
          dir_names: true
          dir_names_max_depth: 1

      - name: Prepare Deploy Target Module List
        id: deploy-target
        run: |
          changed_dirs="${{ steps.changed-dir-names.outputs.all_changed_files }}"
          if [[ -z "$changed_dirs" ]]; then
            echo "No changed directories found. Skipping the Prepare Deploy Target Module step."
            exit 0
          fi
          
          echo "Changed Directories: $changed_dirs"
          
          all_impacted_modules=(til-common til-domain)
          excluded_modules=(til-common til-domain til-batch)
          
          if [[ $(echo $changed_dirs ${all_impacted_modules[@]} | tr ' ' '\n' | sort | uniq -d | tr '\n' ' ') ]]; then
            to_update=$(find . -maxdepth 1 -type d -name 'til-*' -exec basename {} \;)
          else
            to_update="$changed_dirs"
          fi
          
          # excluded_modules 제외
          to_update=$(echo "$to_update" | grep -v -E "$(IFS=\|; echo "${excluded_modules[*]}")" | xargs)
          
          echo "Deploy Target module: $to_update"
          echo "to_update_list=$to_update" >> "$GITHUB_OUTPUT"

  build_and_docker_push:
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.to_update_list != '' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -Pprofile=dev --exclude-task test --parallel

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Docker Image Build & Push
        run: |
          IFS=' ' read -r -a modules <<< "${{ needs.check-changes.outputs.to_update_list }}"
          
          for module in "${modules[@]}"; do
            echo "Build and Push Docker image for module: $module"
            docker build -t somatil/$module \
              --build-arg PROFILE=dev --build-arg PROJECT_NAME=$module -f docker/Dockerfile .
            docker push somatil/$module
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_docker_push
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_KEY }}
          script: |
            cd ~/backend
            docker-compose down && docker-compose pull
            docker-compose up -d
            docker image prune
